###################
# ### Globals ### #
###################

Terminator = CR LF;
#Terminator = LF;
#Terminator=CR;
ReplyTimeout=1000;
ReadTimeout=1000;
#
#       Protocols
#
##
#       Discard Extra Inputs
#	IF NECESSARY
##
ExtraInput = Ignore;
getModel {
	out "pr vr";
	in "%*c";
#	in ">pr vr";
#	in "%*8c";
	in "%s";
}
#
#	MDRIVE NEED A RESET
#
resetError {
	out "er";
	in "%*c";
}
#
#	MDRIVE NEED AN ERROR BUFFER
#	TO READ LIMIT SWITCH
#
getError {
	out "pr er";	
	in "%*c";
	in "%d";
}
getStatus {
        out "pr de";
        in "%*c";
        in "%d";
}
setStatus {
        out "de %b";
	in "%*c";
}
getMoving {
        out "pr mv";
	in "%*c";
	in "%d";
}
getPos {
	out "pr p";
        in "%*c";
        in "%d";
}
setHome {
	out "hm \$1";
	in "%*c";
}
setMovAbs {
	out "ma %d";
	in "%*c";
}
setMovRel {
        out "mr %d";
	in "%*c";
}
setStop {
	out "sl 0";
	in "%*c";
}
setVel {
	out "vm %f";
	in "%*c";
}
getVel {
	out "pr vm";
	in "%*c";
	in "%f";
}
